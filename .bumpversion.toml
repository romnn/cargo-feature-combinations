[tool.bumpversion]
current_version = "0.4.2"
commit = true
tag = true
pre_commit_hooks = [
  # Refresh workspace package versions without updating dependencies.
  "cargo metadata --offline --format-version 1 >/dev/null"
]
additional_files = [
  "Cargo.lock"
]

[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""
