# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: lint
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_AUTO_INSTALL: "0"
  # Runners sometimes fail release downloads for several seconds, and mise's default three
  # retries are spent within about three; twelve keep retrying for about two minutes.
  MISE_HTTP_RETRIES: "12"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: true
          env: false
      - run: >-
          mise install task zig ast-grep github:romnn/cargo-feature-combinations
          aqua:rustsec/rustsec/cargo-audit github:est31/cargo-udeps
          github:rust-cross/cargo-zigbuild
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Audit
        # A new advisory can land without a repository change, so surface it without blocking.
        continue-on-error: true
        run: task audit
      - name: Check for unused dependencies
        run: task unused-dependencies
      - name: Lint (all feature combinations × targets)
        run: task lint:fc

  spellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: true
          env: false
      - run: mise install task typos
      - name: Spellcheck
        run: task spellcheck
