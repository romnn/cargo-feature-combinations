# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: pages
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # The docs render these example workspaces' Cargo.toml files verbatim and their
      # cargo-fc output as live HTML terminal snippets.
      - "examples/**"
      - "src/**"
      - "scripts/terminals.sh"
      - "mise.toml"
      - "mise.lock"
      - "taskfile.yaml"
      - ".github/workflows/pages.yaml"
  workflow_dispatch: {}

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_AUTO_INSTALL: "0"

# Allow the GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment without cancelling an in-progress production deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
          cache: true
          env: false
      # Go, extended Hugo, task, and terminal-to-html come from mise.
      # The site renders cargo-fc output as live HTML terminals, so it needs no image rasterizer.
      # freeze, jq, and ImageMagick are only for the README PNGs regenerated by hand with
      # `task docs:screenshots`.
      - name: Install docs toolchain
        run: >-
          mise install
          go "asdf:NeoHsu/asdf-hugo" task
          "github:buildkite/terminal-to-html"
      # cargo-fc is built from source because the docs render its live output.
      # wasm32 is needed for the multi-target example.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      # Regenerate terminal snippets from the current source, then build the site with the same
      # task used locally.
      - name: Build docs
        run: task docs:build -- --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
