# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: build
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_AUTO_INSTALL: "0"
  # Runners sometimes fail release downloads for several seconds, and mise's default three
  # retries are spent within about three; twelve keep retrying for about two minutes.
  MISE_HTTP_RETRIES: "12"

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: true
          env: false
      - run: mise install task
      - name: Release (dry-run)
        run: task build:goreleaser
